<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff" rx="8"/>
  <!-- Title -->
  <text x="360" y="18" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="0.3">Corridors -- the source/destination pairing changes every decision</text>

  <!-- Body: original 680x310 content scaled to 720 and shifted below the title -->
  <g transform="translate(0,-44) scale(1.0588)">
    <!-- Column A: T to C -->
    <rect x="16" y="70" width="318" height="240" fill="#458588" fill-opacity="0.06" rx="6"/>
    <rect x="16" y="70" width="318" height="3" fill="#458588" rx="6"/>
    <text x="30" y="94" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Transactional &#8594; Columnar</text>
    <text x="30" y="110" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">e.g. PostgreSQL &#8594; BigQuery</text>
    <!-- Rows -->
    <text x="30" y="140" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Type system gap</text>
    <text x="320" y="140" text-anchor="end" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">Wide</text>
    <line x1="30" y1="150" x2="320" y2="150" stroke="#ebdbb2" stroke-width="1"/>
    <text x="30" y="170" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Mutation cost</text>
    <text x="320" y="170" text-anchor="end" fill="#cc241d" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">Expensive</text>
    <line x1="30" y1="180" x2="320" y2="180" stroke="#ebdbb2" stroke-width="1"/>
    <text x="30" y="200" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Constraints</text>
    <text x="320" y="200" text-anchor="end" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500">None enforced</text>
    <line x1="30" y1="210" x2="320" y2="210" stroke="#ebdbb2" stroke-width="1"/>
    <text x="30" y="230" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Cost model</text>
    <text x="320" y="230" text-anchor="end" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500">Per bytes/slots</text>
    <line x1="30" y1="240" x2="320" y2="240" stroke="#ebdbb2" stroke-width="1"/>
    <text x="30" y="260" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Default load</text>
    <text x="320" y="260" text-anchor="end" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500">Append, partition swap</text>
    <line x1="30" y1="270" x2="320" y2="270" stroke="#ebdbb2" stroke-width="1"/>
    <text x="30" y="290" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Deduplication</text>
    <text x="320" y="290" text-anchor="end" fill="#d79921" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500">Your problem</text>

    <!-- Column B: T to T -->
    <rect x="346" y="70" width="318" height="240" fill="#689d6a" fill-opacity="0.06" rx="6"/>
    <rect x="346" y="70" width="318" height="3" fill="#689d6a" rx="6"/>
    <text x="360" y="94" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">Transactional &#8594; Transactional</text>
    <text x="360" y="110" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">e.g. PostgreSQL &#8594; PostgreSQL</text>
    <!-- Rows -->
    <text x="360" y="140" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Type system gap</text>
    <text x="650" y="140" text-anchor="end" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">Narrow</text>
    <line x1="360" y1="150" x2="650" y2="150" stroke="#ebdbb2" stroke-width="1"/>
    <text x="360" y="170" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Mutation cost</text>
    <text x="650" y="170" text-anchor="end" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">Cheap</text>
    <line x1="360" y1="180" x2="650" y2="180" stroke="#ebdbb2" stroke-width="1"/>
    <text x="360" y="200" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Constraints</text>
    <text x="650" y="200" text-anchor="end" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500">PK, FK, UNIQUE</text>
    <line x1="360" y1="210" x2="650" y2="210" stroke="#ebdbb2" stroke-width="1"/>
    <text x="360" y="230" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Cost model</text>
    <text x="650" y="230" text-anchor="end" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500">Fixed infra</text>
    <line x1="360" y1="240" x2="650" y2="240" stroke="#ebdbb2" stroke-width="1"/>
    <text x="360" y="260" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Default load</text>
    <text x="650" y="260" text-anchor="end" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500">MERGE / upsert</text>
    <line x1="360" y1="270" x2="650" y2="270" stroke="#ebdbb2" stroke-width="1"/>
    <text x="360" y="290" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Deduplication</text>
    <text x="650" y="290" text-anchor="end" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500">Engine enforces</text>
  </g>
</svg>
