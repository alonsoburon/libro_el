<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <rect width="720" height="460" fill="#ffffff" rx="6"/>
  <text x="360" y="18" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="0.3">Extraction strategy: pick the shortest path that fits</text>

  <!-- ═══════════════════════════════════════════════════
       Layout:
         Center column (x~360): decisions flow top to bottom
         Left (x~96):   T1 Full replace + hard-delete, T4 Sequential ID + hard-delete
         Right (x~580): D3 sub-hourly + T2/T3, T5 Hash-based
         Bottom center:  T6 Scoped full replace
       ═══════════════════════════════════════════════════ -->

  <!-- ═══ START node ═══ -->
  <rect x="300" y="32" width="120" height="26" fill="#ebdbb2" stroke="#7c6f64" stroke-width="1.2" rx="13"/>
  <text x="360" y="49" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600">New table</text>

  <line x1="360" y1="58" x2="360" y2="70" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,69 360,75 363,69" fill="#7c6f64"/>

  <!-- ═══ D1: Full scan fits schedule window? (y=75) ═══ -->
  <rect x="258" y="75" width="204" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="360" y="88" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Full scan fits schedule window?</text>
  <text x="360" y="99" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">table size vs. available time</text>

  <!-- D1 YES: left to T1 -->
  <line x1="258" y1="90" x2="178" y2="90" stroke="#79740e" stroke-width="1.2"/>
  <polygon points="179,87 173,90 179,93" fill="#79740e"/>
  <text x="216" y="84" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- D1 NO: down to D2 -->
  <line x1="360" y1="105" x2="360" y2="140" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,139 360,145 363,139" fill="#7c6f64"/>
  <text x="370" y="126" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600">NO</text>

  <!-- ═══ T1: Full replace (green, left) ═══ -->
  <rect x="20" y="76" width="153" height="28" fill="#79740e" opacity="0.08" rx="4"/>
  <rect x="20" y="76" width="153" height="28" fill="none" stroke="#79740e" stroke-width="1.2" rx="4"/>
  <text x="32" y="92" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700">&#x2713;</text>
  <text x="47" y="91" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600">Full replace</text>
  <text x="122" y="91" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#167;2.1)</text>

  <!-- T1 secondary: Hard deletes handled automatically -->
  <line x1="96" y1="104" x2="96" y2="115" stroke="#7c6f64" stroke-width="0.8" stroke-dasharray="3,2"/>
  <polygon points="93,114 96,119 99,114" fill="#7c6f64"/>
  <text x="96" y="129" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-style="italic">Hard deletes?</text>
  <rect x="32" y="134" width="128" height="20" fill="#79740e" opacity="0.05" rx="4"/>
  <rect x="32" y="134" width="128" height="20" fill="none" stroke="#79740e" stroke-width="0.8" rx="4" stroke-dasharray="3,2"/>
  <text x="96" y="148" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">Handled automatically</text>

  <!-- ═══ D2: Has reliable updated_at? (y=145) ═══ -->
  <rect x="258" y="145" width="204" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="360" y="158" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Has reliable updated_at?</text>
  <text x="360" y="169" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">set on every write, never null</text>

  <!-- D2 YES: right to D3 -->
  <line x1="462" y1="160" x2="520" y2="160" stroke="#79740e" stroke-width="1.2"/>
  <line x1="520" y1="160" x2="520" y2="196" stroke="#79740e" stroke-width="1"/>
  <polygon points="517,195 520,201 523,195" fill="#79740e"/>
  <text x="492" y="156" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- D2 NO: down to D4 -->
  <line x1="360" y1="175" x2="360" y2="218" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,217 360,223 363,217" fill="#7c6f64"/>
  <text x="370" y="200" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600">NO</text>

  <!-- ═══ D3: Need sub-hourly freshness? (right, y=201) ═══ -->
  <rect x="418" y="201" width="204" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="520" y="214" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Need sub-hourly freshness?</text>
  <text x="520" y="225" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">high-frequency extraction</text>

  <!-- D3 YES: right to T2 -->
  <line x1="622" y1="210" x2="665" y2="210" stroke="#79740e" stroke-width="1.2"/>
  <line x1="665" y1="210" x2="665" y2="249" stroke="#79740e" stroke-width="1"/>
  <polygon points="662,248 665,254 668,248" fill="#79740e"/>
  <text x="644" y="206" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- D3 NO: down to T3 -->
  <line x1="520" y1="231" x2="520" y2="249" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="517,248 520,254 523,248" fill="#7c6f64"/>
  <text x="530" y="244" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600">NO</text>

  <!-- ═══ T2: Cursor-based (blue, far right) ═══ -->
  <rect x="590" y="254" width="125" height="28" fill="#458588" opacity="0.08" rx="4"/>
  <rect x="590" y="254" width="125" height="28" fill="none" stroke="#458588" stroke-width="1.2" rx="4"/>
  <text x="605" y="271" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600">Cursor-based</text>
  <text x="681" y="271" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#167;3.2)</text>

  <!-- ═══ T3: Stateless window (blue, right) ═══ -->
  <rect x="450" y="254" width="135" height="28" fill="#458588" opacity="0.08" rx="4"/>
  <rect x="450" y="254" width="135" height="28" fill="none" stroke="#458588" stroke-width="1.2" rx="4"/>
  <text x="465" y="271" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600">Stateless window</text>
  <text x="560" y="271" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#167;3.3)</text>

  <!-- T2+T3 secondary: Hard deletes -->
  <line x1="585" y1="288" x2="585" y2="302" stroke="#7c6f64" stroke-width="0.8" stroke-dasharray="3,2"/>
  <polygon points="582,301 585,306 588,301" fill="#7c6f64"/>
  <text x="585" y="316" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-style="italic">Hard deletes?</text>
  <rect x="495" y="322" width="180" height="20" fill="#d65d0e" opacity="0.08" rx="4"/>
  <rect x="495" y="322" width="180" height="20" fill="none" stroke="#d65d0e" stroke-width="1" rx="4"/>
  <text x="585" y="336" text-anchor="middle" fill="#d65d0e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" font-weight="600">+ Add delete detection (&#167;3.6)</text>

  <!-- ═══ D4: Has monotonic PK? (center, y=223) ═══ -->
  <rect x="258" y="223" width="204" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="360" y="236" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Has monotonic PK?</text>
  <text x="360" y="247" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">auto-increment / sequence</text>

  <!-- D4 YES: left to T4 -->
  <line x1="258" y1="238" x2="178" y2="238" stroke="#79740e" stroke-width="1.2"/>
  <polygon points="179,235 173,238 179,241" fill="#79740e"/>
  <text x="216" y="234" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- D4 NO: down to D5 -->
  <line x1="360" y1="253" x2="360" y2="316" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,315 360,321 363,315" fill="#7c6f64"/>
  <text x="370" y="290" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600">NO</text>

  <!-- ═══ T4: Sequential ID cursor (blue, left) ═══ -->
  <rect x="20" y="224" width="153" height="28" fill="#458588" opacity="0.08" rx="4"/>
  <rect x="20" y="224" width="153" height="28" fill="none" stroke="#458588" stroke-width="1.2" rx="4"/>
  <text x="35" y="241" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600">Sequential ID cursor</text>
  <text x="150" y="241" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#167;3.5)</text>

  <!-- T4 secondary: Hard deletes -->
  <line x1="96" y1="252" x2="96" y2="264" stroke="#7c6f64" stroke-width="0.8" stroke-dasharray="3,2"/>
  <polygon points="93,263 96,268 99,263" fill="#7c6f64"/>
  <text x="96" y="278" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-style="italic">Hard deletes?</text>
  <rect x="11" y="284" width="170" height="20" fill="#d65d0e" opacity="0.08" rx="4"/>
  <rect x="11" y="284" width="170" height="20" fill="none" stroke="#d65d0e" stroke-width="1" rx="4"/>
  <text x="96" y="298" text-anchor="middle" fill="#d65d0e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" font-weight="600">+ Add delete detection (&#167;3.6)</text>

  <!-- ═══ D5: Source rewrites history? (center, y=321) ═══ -->
  <rect x="258" y="321" width="204" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="360" y="334" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Source rewrites history?</text>
  <text x="360" y="345" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">past rows mutate silently</text>

  <!-- D5 YES: left to T5 -->
  <line x1="258" y1="336" x2="178" y2="336" stroke="#79740e" stroke-width="1.2"/>
  <polygon points="179,333 173,336 179,339" fill="#79740e"/>
  <text x="216" y="332" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- D5 NO: down to T6 -->
  <line x1="360" y1="351" x2="360" y2="385" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,384 360,390 363,384" fill="#7c6f64"/>
  <text x="370" y="372" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600">NO</text>

  <!-- ═══ T5: Hash-based change detection (orange, left) ═══ -->
  <rect x="10" y="322" width="163" height="28" fill="#d65d0e" opacity="0.10" rx="4"/>
  <rect x="10" y="322" width="163" height="28" fill="none" stroke="#d65d0e" stroke-width="1.5" rx="4"/>
  <text x="25" y="339" fill="#d65d0e" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600">Hash-based detection</text>
  <text x="149" y="339" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#167;2.8)</text>

  <!-- ═══ T6: Scoped full replace (green, center bottom) ═══ -->
  <rect x="283" y="390" width="154" height="28" fill="#79740e" opacity="0.08" rx="4"/>
  <rect x="283" y="390" width="154" height="28" fill="none" stroke="#79740e" stroke-width="1.2" rx="4"/>
  <text x="298" y="407" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700">&#x2713;</text>
  <text x="313" y="406" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600">Scoped full replace</text>
  <text x="415" y="406" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#167;2.4)</text>

  <!-- ═══ Legend band ═══ -->
  <rect x="30" y="432" width="660" height="20" fill="#f9f5d7" opacity="0.5" rx="3"/>
  <rect x="30" y="432" width="660" height="20" fill="none" stroke="#d5c4a1" stroke-width="0.6" rx="3"/>
  <rect x="50" y="437" width="10" height="10" fill="#79740e" opacity="0.12" stroke="#79740e" stroke-width="0.6" rx="2"/>
  <text x="64" y="446" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">full replace</text>
  <rect x="155" y="437" width="10" height="10" fill="#458588" opacity="0.12" stroke="#458588" stroke-width="0.6" rx="2"/>
  <text x="169" y="446" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">incremental</text>
  <rect x="260" y="437" width="10" height="10" fill="#d65d0e" opacity="0.14" stroke="#d65d0e" stroke-width="0.6" rx="2"/>
  <text x="274" y="446" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">caution / extra work</text>
  <rect x="415" y="437" width="10" height="10" fill="none" stroke="#7c6f64" stroke-width="0.6" stroke-dasharray="2,1.5" rx="2"/>
  <text x="429" y="446" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">secondary concern (hard deletes)</text>
</svg>