<svg xmlns="http://www.w3.org/2000/svg" width="900" height="592" viewBox="0 0 900 592">
  <rect width="900" height="592" fill="#ffffff" rx="8"/>
  <text x="450" y="22" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="0.3">The domain model -- core documents and the inventory subject area</text>

  <!-- ============ Relationship lines (behind boxes) ============ -->
  <!-- 1:N header-detail (solid, vertical) -->
  <line x1="150" y1="144" x2="150" y2="212" stroke="#928374" stroke-width="1.5"/>
  <text x="158" y="182" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">1:N</text>
  <line x1="750" y1="144" x2="750" y2="212" stroke="#928374" stroke-width="1.5"/>
  <text x="758" y="182" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">1:N</text>

  <!-- FK references (dashed, horizontal) -->
  <line x1="345" y1="94" x2="255" y2="94" stroke="#bdae93" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="89" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">customer_id</text>
  <line x1="555" y1="94" x2="645" y2="94" stroke="#bdae93" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="600" y="89" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">customer_id</text>
  <line x1="345" y1="262" x2="255" y2="262" stroke="#bdae93" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="257" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">product_id</text>
  <line x1="555" y1="262" x2="645" y2="262" stroke="#bdae93" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="600" y="257" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">product_id</text>

  <!-- products -> inventory facts (sku_id), down then out -->
  <path d="M 410 312 L 410 350 L 150 350 L 150 360" stroke="#bdae93" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <path d="M 490 312 L 490 350 L 750 350 L 750 360" stroke="#bdae93" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <text x="450" y="347" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">sku_id (= product id)</text>

  <!-- warehouses -> inventory facts (warehouse_id), horizontal -->
  <line x1="345" y1="396" x2="255" y2="396" stroke="#bdae93" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="391" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">warehouse_id</text>
  <line x1="555" y1="396" x2="645" y2="396" stroke="#bdae93" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="600" y="391" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">warehouse_id</text>

  <!-- ============ Row 1 ============ -->
  <rect x="45" y="44" width="210" height="100" fill="#f9f5d7" rx="5"/>
  <rect x="45" y="44" width="210" height="4" fill="#458588" rx="5"/>
  <text x="57" y="65" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">orders</text>
  <text x="57" y="79" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">Unreliable updated_at</text>
  <text x="57" y="97" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">id PK</text>
  <text x="57" y="111" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">customer_id FK</text>
  <text x="57" y="125" fill="#d79921" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">updated_at (unreliable)</text>
  <text x="57" y="139" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">status</text>

  <rect x="345" y="44" width="210" height="100" fill="#f9f5d7" rx="5"/>
  <rect x="345" y="44" width="210" height="4" fill="#b16286" rx="5"/>
  <text x="357" y="65" fill="#b16286" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">customers</text>
  <text x="357" y="79" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">Soft delete via is_active</text>
  <text x="357" y="97" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">id PK</text>
  <text x="357" y="111" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">is_active</text>
  <text x="357" y="125" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">email</text>

  <rect x="645" y="44" width="210" height="100" fill="#f9f5d7" rx="5"/>
  <rect x="645" y="44" width="210" height="4" fill="#458588" rx="5"/>
  <text x="657" y="65" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">invoices</text>
  <text x="657" y="79" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">Open/closed, hard deletes</text>
  <text x="657" y="97" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">id PK</text>
  <text x="657" y="111" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">customer_id FK</text>
  <text x="657" y="125" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">doc_status O/C</text>
  <text x="657" y="139" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">posted_at</text>

  <!-- ============ Row 2 ============ -->
  <rect x="45" y="212" width="210" height="100" fill="#f9f5d7" rx="5"/>
  <rect x="45" y="212" width="210" height="4" fill="#458588" rx="5"/>
  <text x="57" y="233" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">order_lines</text>
  <text x="57" y="247" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">No own timestamp</text>
  <text x="57" y="265" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">id PK</text>
  <text x="57" y="279" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">order_id FK</text>
  <text x="57" y="293" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">product_id FK</text>

  <rect x="345" y="212" width="210" height="100" fill="#f9f5d7" rx="5"/>
  <rect x="345" y="212" width="210" height="4" fill="#b16286" rx="5"/>
  <text x="357" y="233" fill="#b16286" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">products</text>
  <text x="357" y="247" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">Item master (sku), schema mutates</text>
  <text x="357" y="265" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">id PK  (the sku)</text>
  <text x="357" y="279" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">name</text>
  <text x="357" y="293" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">... (mutating)</text>

  <rect x="645" y="212" width="210" height="100" fill="#f9f5d7" rx="5"/>
  <rect x="645" y="212" width="210" height="4" fill="#458588" rx="5"/>
  <text x="657" y="233" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">invoice_lines</text>
  <text x="657" y="247" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">Independent hard deletes</text>
  <text x="657" y="265" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">id PK</text>
  <text x="657" y="279" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">invoice_id FK</text>
  <text x="657" y="293" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">product_id FK  ·  status</text>

  <!-- ============ Inventory subject area ============ -->
  <line x1="20" y1="342" x2="880" y2="342" stroke="#ebdbb2" stroke-width="1"/>
  <text x="20" y="338" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-style="italic">inventory subject area -- item (sku) x warehouse</text>

  <!-- inventory (fact) -->
  <rect x="45" y="360" width="210" height="72" fill="#f9f5d7" rx="5"/>
  <rect x="45" y="360" width="210" height="4" fill="#d65d0e" rx="5"/>
  <text x="57" y="380" fill="#d65d0e" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">inventory</text>
  <text x="57" y="394" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">Sparse SKU x warehouse, mostly zeros</text>
  <text x="57" y="412" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">(sku_id, warehouse_id) PK</text>
  <text x="57" y="426" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">on_hand  ·  on_order</text>

  <!-- warehouses (dimension) -->
  <rect x="345" y="360" width="210" height="72" fill="#f9f5d7" rx="5"/>
  <rect x="345" y="360" width="210" height="4" fill="#b16286" rx="5"/>
  <text x="357" y="380" fill="#b16286" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">warehouses</text>
  <text x="357" y="394" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">Warehouse master (OWHS-style)</text>
  <text x="357" y="412" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">id PK</text>
  <text x="357" y="426" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">code  ·  name</text>

  <!-- inventory_movements (fact, append-only) -->
  <rect x="645" y="360" width="210" height="72" fill="#f9f5d7" rx="5"/>
  <rect x="645" y="360" width="210" height="4" fill="#d65d0e" rx="5"/>
  <text x="657" y="380" fill="#d65d0e" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">inventory_movements</text>
  <text x="657" y="394" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">Append-only stock log</text>
  <text x="657" y="412" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">id PK  ·  sku_id FK</text>
  <text x="657" y="426" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">warehouse_id FK  ·  type  ·  qty</text>

  <!-- ============ Append-only / standalone ============ -->
  <line x1="20" y1="450" x2="880" y2="450" stroke="#ebdbb2" stroke-width="1"/>
  <text x="20" y="446" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-style="italic">append-only / standalone -- no foreign keys</text>

  <rect x="45" y="466" width="210" height="66" fill="#f9f5d7" rx="5"/>
  <rect x="45" y="466" width="210" height="4" fill="#689d6a" rx="5"/>
  <text x="57" y="486" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">events</text>
  <text x="57" y="500" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">Append-only, partitioned by date</text>
  <text x="57" y="517" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">id PK · event_date · payload</text>

  <rect x="345" y="466" width="210" height="66" fill="#f9f5d7" rx="5"/>
  <rect x="345" y="466" width="210" height="4" fill="#689d6a" rx="5"/>
  <text x="357" y="486" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">sessions</text>
  <text x="357" y="500" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">Sessionized clickstream</text>
  <text x="357" y="517" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">id PK · started_at</text>

  <rect x="645" y="466" width="210" height="66" fill="#f9f5d7" rx="5"/>
  <rect x="645" y="466" width="210" height="4" fill="#689d6a" rx="5"/>
  <text x="657" y="486" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">metrics_daily</text>
  <text x="657" y="500" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">Pre-aggregated, overwritten daily</text>
  <text x="657" y="517" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">date · metric · value</text>

  <!-- ============ Legend ============ -->
  <line x1="20" y1="552" x2="880" y2="552" stroke="#ebdbb2" stroke-width="1"/>
  <rect x="120" y="569" width="14" height="3" fill="#458588" rx="1"/>
  <text x="140" y="575" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">Transactional documents</text>
  <rect x="300" y="569" width="14" height="3" fill="#b16286" rx="1"/>
  <text x="320" y="575" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">Reference / master</text>
  <rect x="430" y="569" width="14" height="3" fill="#d65d0e" rx="1"/>
  <text x="450" y="575" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">Inventory</text>
  <rect x="530" y="569" width="14" height="3" fill="#689d6a" rx="1"/>
  <text x="550" y="575" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">Append-only</text>
  <line x1="650" y1="571" x2="674" y2="571" stroke="#928374" stroke-width="1.5"/>
  <text x="682" y="575" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">1:N</text>
  <line x1="730" y1="571" x2="760" y2="571" stroke="#bdae93" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="768" y="575" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">FK</text>
</svg>
