<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180">
  <rect width="720" height="180" fill="#ffffff" rx="6"/>
  <text x="360" y="18" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="0.3">Scoped full replace: three zones, one table</text>

  <!-- ======= Timeline axis ======= -->
  <line x1="40" y1="110" x2="680" y2="110" stroke="#d5c4a1" stroke-width="1"/>
  <text x="40" y="126" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">oldest</text>
  <text x="680" y="126" text-anchor="end" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">now</text>

  <!-- ======= Cold zone ======= -->
  <rect x="40" y="38" width="200" height="65" fill="#79740e" opacity="0.06" stroke="#79740e" stroke-width="1.2" rx="5"/>
  <text x="140" y="56" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700">Cold zone</text>
  <text x="140" y="70" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">2+ years ago</text>
  <text x="140" y="84" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" font-style="italic">weekly full replace</text>
  <text x="140" y="96" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">cheap, bounded source query</text>

  <!-- ======= Warm zone ======= -->
  <rect x="250" y="38" width="230" height="65" fill="#458588" opacity="0.06" stroke="#458588" stroke-width="1.2" rx="5"/>
  <text x="365" y="56" text-anchor="middle" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700">Warm zone</text>
  <text x="365" y="70" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">current year incl. last 7 days</text>
  <text x="365" y="84" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" font-style="italic">daily full replace via partition swap</text>
  <text x="365" y="96" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">nightly purity reset</text>

  <!-- ======= Hot zone ======= -->
  <rect x="490" y="38" width="190" height="65" fill="#d65d0e" opacity="0.08" stroke="#d65d0e" stroke-width="1.5" rx="5"/>
  <text x="585" y="56" text-anchor="middle" fill="#d65d0e" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700">Hot zone</text>
  <text x="585" y="70" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">last 7 days</text>
  <text x="585" y="84" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" font-style="italic">intraday incremental (hourly)</text>
  <text x="585" y="96" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">freshness layer, not source of truth</text>

  <!-- ======= Overlap indicator ======= -->
  <rect x="480" y="103" width="20" height="7" fill="#458588" opacity="0.15"/>
  <rect x="480" y="103" width="20" height="7" fill="#d65d0e" opacity="0.15"/>

  <!-- ======= Cascade arrows ======= -->
  <text x="360" y="148" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">
    <tspan fill="#d65d0e" font-weight="600">hot</tspan> provides freshness
    <tspan dx="8" fill="#928374">|</tspan>
    <tspan dx="8" fill="#458588" font-weight="600">warm</tspan> resets nightly
    <tspan dx="8" fill="#928374">|</tspan>
    <tspan dx="8" fill="#79740e" font-weight="600">cold</tspan> resets weekly
  </text>
  <text x="360" y="162" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-style="italic">each tier corrects what the faster tier above it missed</text>
</svg>
