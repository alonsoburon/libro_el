<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <rect width="720" height="340" fill="#ffffff" rx="6"/>
  <text x="360" y="18" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="0.3">Load strategy: match the pattern to the destination engine</text>

  <!-- ═══ START node ═══ -->
  <rect x="280" y="30" width="160" height="26" fill="#ebdbb2" stroke="#7c6f64" stroke-width="1.2" rx="13"/>
  <text x="360" y="47" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600">Extracted batch ready</text>

  <line x1="360" y1="56" x2="360" y2="68" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,67 360,73 363,67" fill="#7c6f64"/>

  <!-- ═══ Decision 1: Source immutable? ═══ -->
  <rect x="265" y="73" width="190" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="360" y="86" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Source immutable?</text>
  <text x="360" y="97" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">events, movements, logs</text>

  <!-- D1 YES: left to append-only terminal -->
  <line x1="265" y1="88" x2="185" y2="88" stroke="#79740e" stroke-width="1.2"/>
  <polygon points="186,85 180,88 186,91" fill="#79740e"/>
  <text x="224" y="84" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- Terminal: Append-only (green) -->
  <rect x="30" y="73" width="150" height="30" fill="#79740e" opacity="0.08" rx="4"/>
  <rect x="30" y="73" width="150" height="30" fill="none" stroke="#79740e" stroke-width="1.2" rx="4"/>
  <text x="42" y="89" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700">&#x2713;</text>
  <text x="57" y="88" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700">Append-only</text>
  <text x="127" y="88" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#xa7;4.2)</text>
  <text x="105" y="99" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">insert, never update</text>

  <!-- D1 NO: down -->
  <line x1="360" y1="103" x2="360" y2="118" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,117 360,123 363,117" fill="#7c6f64"/>
  <text x="370" y="114" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600">NO</text>

  <!-- ═══ Decision 2: Destination engine type? ═══ -->
  <rect x="265" y="123" width="190" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="360" y="136" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Destination engine type?</text>
  <text x="360" y="147" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">columnar vs. transactional</text>

  <!-- D2 branch left: Columnar -->
  <line x1="265" y1="138" x2="180" y2="138" stroke="#7c6f64" stroke-width="1"/>
  <line x1="180" y1="138" x2="180" y2="168" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="177,167 180,173 183,167" fill="#7c6f64"/>
  <text x="222" y="134" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">Columnar</text>

  <!-- D2 branch right: Transactional -->
  <line x1="455" y1="138" x2="540" y2="138" stroke="#7c6f64" stroke-width="1"/>
  <line x1="540" y1="138" x2="540" y2="168" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="537,167 540,173 543,167" fill="#7c6f64"/>
  <text x="498" y="134" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">Transactional</text>

  <!-- ═══ Decision 3: MERGE cost acceptable? (Columnar branch) ═══ -->
  <rect x="85" y="173" width="190" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="180" y="186" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">MERGE cost acceptable?</text>
  <text x="180" y="197" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">full table rewrite on each load</text>

  <!-- D3 YES: down-left to Merge/Upsert terminal -->
  <line x1="130" y1="203" x2="130" y2="222" stroke="#458588" stroke-width="1"/>
  <polygon points="127,221 130,227 133,221" fill="#458588"/>
  <text x="113" y="215" text-anchor="middle" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- D3 NO: down-right to Append and materialize terminal -->
  <line x1="230" y1="203" x2="230" y2="222" stroke="#458588" stroke-width="1"/>
  <polygon points="227,221 230,227 233,221" fill="#458588"/>
  <text x="247" y="215" text-anchor="middle" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">NO</text>

  <!-- Terminal: Merge / Upsert, columnar (blue) -->
  <rect x="40" y="227" width="155" height="34" fill="#458588" opacity="0.08" rx="4"/>
  <rect x="40" y="227" width="155" height="34" fill="none" stroke="#458588" stroke-width="1.2" rx="4"/>
  <text x="52" y="244" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700">Merge / Upsert</text>
  <text x="148" y="244" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#xa7;4.3)</text>
  <text x="117" y="256" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">matched update + insert</text>

  <!-- Terminal: Append and materialize (blue) -->
  <rect x="200" y="227" width="170" height="34" fill="#458588" opacity="0.08" rx="4"/>
  <rect x="200" y="227" width="170" height="34" fill="none" stroke="#458588" stroke-width="1.2" rx="4"/>
  <text x="212" y="244" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700">Append + materialize</text>
  <text x="345" y="244" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#xa7;4.4)</text>
  <text x="285" y="256" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">append log, compact via view</text>

  <!-- ═══ Transactional branch: Merge / Upsert terminal (blue) ═══ -->
  <rect x="460" y="173" width="160" height="34" fill="#458588" opacity="0.08" rx="4"/>
  <rect x="460" y="173" width="160" height="34" fill="none" stroke="#458588" stroke-width="1.2" rx="4"/>
  <text x="472" y="190" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700">Merge / Upsert</text>
  <text x="564" y="190" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">(&#xa7;4.3)</text>
  <text x="540" y="202" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">native MERGE is cheap here</text>

  <!-- Arrow from transactional Merge down to Decision 4 -->
  <line x1="540" y1="207" x2="540" y2="226" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="537,225 540,231 543,225" fill="#7c6f64"/>

  <!-- ═══ Decision 4: Also need columnar log? ═══ -->
  <rect x="445" y="231" width="190" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="540" y="244" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Also need columnar log?</text>
  <text x="540" y="255" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">dual-destination pipeline</text>

  <!-- D4 YES: down-left to Hybrid terminal (orange) -->
  <line x1="490" y1="261" x2="490" y2="284" stroke="#d65d0e" stroke-width="1.2"/>
  <polygon points="487,283 490,289 493,283" fill="#d65d0e"/>
  <text x="473" y="276" text-anchor="middle" fill="#d65d0e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- D4 NO: down-right to Done terminal (green muted) -->
  <line x1="590" y1="261" x2="590" y2="284" stroke="#79740e" stroke-width="1"/>
  <polygon points="587,283 590,289 593,283" fill="#79740e"/>
  <text x="607" y="276" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">NO</text>

  <!-- Terminal: Hybrid append-merge (orange) -->
  <rect x="393" y="289" width="160" height="34" fill="#d65d0e" opacity="0.10" rx="4"/>
  <rect x="393" y="289" width="160" height="34" fill="none" stroke="#d65d0e" stroke-width="1.5" rx="4"/>
  <text x="405" y="305" fill="#d65d0e" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700">Hybrid append-merge</text>
  <text x="473" y="317" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5">merge + append (&#xa7;4.5)</text>

  <!-- Terminal: Done (green muted) -->
  <rect x="566" y="289" width="80" height="28" fill="#79740e" opacity="0.08" rx="4"/>
  <rect x="566" y="289" width="80" height="28" fill="none" stroke="#79740e" stroke-width="1.2" rx="4"/>
  <text x="579" y="306" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700">&#x2713;</text>
  <text x="593" y="306" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700">Done</text>
</svg>