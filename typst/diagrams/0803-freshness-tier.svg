<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <rect width="720" height="260" fill="#ffffff" rx="6"/>
  <text x="360" y="18" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="0.3">Freshness tier: match the cadence to the consumer's SLA</text>

  <!-- START node -->
  <rect x="290" y="32" width="140" height="26" fill="#ebdbb2" stroke="#7c6f64" stroke-width="1.2" rx="13"/>
  <text x="360" y="49" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600">Table classified</text>

  <!-- Arrow: start to decision 1 -->
  <line x1="360" y1="58" x2="360" y2="70" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,69 360,75 363,69" fill="#7c6f64"/>

  <!-- Decision 1: sub-hourly -->
  <rect x="265" y="75" width="190" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="360" y="88" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Consumer needs sub-hourly?</text>
  <text x="360" y="99" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">dashboards, operational alerts</text>

  <!-- D1 YES: left to hot terminal -->
  <line x1="265" y1="90" x2="207" y2="90" stroke="#79740e" stroke-width="1.2"/>
  <polygon points="208,87 202,90 208,93" fill="#79740e"/>
  <text x="234" y="86" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- D1 NO: down to decision 2 -->
  <line x1="360" y1="105" x2="360" y2="125" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,124 360,130 363,124" fill="#7c6f64"/>
  <text x="370" y="118" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600">NO</text>

  <!-- Decision 2: daily -->
  <rect x="265" y="130" width="190" height="30" fill="#f9f5d7" stroke="#7c6f64" stroke-width="1" rx="4"/>
  <text x="360" y="143" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600">Consumer needs daily?</text>
  <text x="360" y="154" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="8">morning reports, daily KPIs</text>

  <!-- D2 YES: left to warm terminal -->
  <line x1="265" y1="145" x2="207" y2="145" stroke="#79740e" stroke-width="1.2"/>
  <polygon points="208,142 202,145 208,148" fill="#79740e"/>
  <text x="234" y="141" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="700">YES</text>

  <!-- D2 NO: down to cold terminal -->
  <line x1="360" y1="160" x2="360" y2="180" stroke="#7c6f64" stroke-width="1"/>
  <polygon points="357,179 360,185 363,179" fill="#7c6f64"/>
  <text x="370" y="174" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600">NO</text>

  <!-- ═══ Hot terminal (orange) ═══ -->
  <rect x="50" y="75" width="152" height="34" fill="#d65d0e" opacity="0.10" rx="4"/>
  <rect x="50" y="75" width="152" height="34" fill="none" stroke="#d65d0e" stroke-width="1.5" rx="4"/>
  <rect x="50" y="75" width="4" height="34" fill="#d65d0e" rx="1"/>
  <text x="60" y="89" fill="#d65d0e" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700">Hot tier</text>
  <text x="60" y="102" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">intraday incremental</text>

  <!-- ═══ Warm terminal (blue) ═══ -->
  <rect x="50" y="130" width="152" height="34" fill="#458588" opacity="0.08" rx="4"/>
  <rect x="50" y="130" width="152" height="34" fill="none" stroke="#458588" stroke-width="1.2" rx="4"/>
  <rect x="50" y="130" width="4" height="34" fill="#458588" rx="1"/>
  <text x="60" y="144" fill="#458588" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700">Warm tier</text>
  <text x="60" y="157" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">daily full or wide window</text>

  <!-- ═══ Cold terminal (green) ═══ -->
  <rect x="284" y="185" width="152" height="34" fill="#79740e" opacity="0.08" rx="4"/>
  <rect x="284" y="185" width="152" height="34" fill="none" stroke="#79740e" stroke-width="1.2" rx="4"/>
  <rect x="284" y="185" width="4" height="34" fill="#79740e" rx="1"/>
  <text x="294" y="199" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700">Cold tier</text>
  <text x="294" y="212" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5">weekly/monthly full replace</text>

  <!-- ═══ Reset cascade annotations ═══ -->
  <!-- Hot reset annotation: dotted line from hot terminal down-right, then italic text -->
  <line x1="126" y1="109" x2="126" y2="120" stroke="#928374" stroke-width="0.7" stroke-dasharray="2,2"/>
  <text x="126" y="128" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-style="italic">nightly warm reset catches what hot missed</text>

  <!-- Warm reset annotation: dotted line from warm terminal down-right, then italic text -->
  <line x1="126" y1="164" x2="126" y2="175" stroke="#928374" stroke-width="0.7" stroke-dasharray="2,2"/>
  <text x="126" y="183" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-style="italic">weekly cold reset catches what warm missed</text>

  <!-- Thin cascade bracket on the right connecting all three tiers -->
  <line x1="455" y1="92" x2="510" y2="92" stroke="#d5c4a1" stroke-width="0.8"/>
  <line x1="510" y1="92" x2="510" y2="202" stroke="#d5c4a1" stroke-width="0.8"/>
  <line x1="455" y1="147" x2="510" y2="147" stroke="#d5c4a1" stroke-width="0.8"/>
  <line x1="436" y1="202" x2="510" y2="202" stroke="#d5c4a1" stroke-width="0.8"/>

  <!-- Cascade label -->
  <text x="524" y="140" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-style="italic">each tier is a</text>
  <text x="524" y="150" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-style="italic">safety net for</text>
  <text x="524" y="160" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-style="italic">the one above</text>

  <!-- Small downward arrows on cascade bracket -->
  <polygon points="507,130 510,136 513,130" fill="#d5c4a1"/>
  <polygon points="507,180 510,186 513,180" fill="#d5c4a1"/>
</svg>
