<svg xmlns="http://www.w3.org/2000/svg" width="720" height="417" viewBox="0 0 720 417">
  <rect width="720" height="417" fill="#ffffff" rx="8"/>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#bdae93"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="18" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="0.3">Earning Complexity -- move only when the table forces you</text>

  <!-- Body scaled to 720 wide -->
  <g transform="scale(0.94737)">

    <!-- Node 1: Full scan fits schedule? -->
    <rect x="260" y="70" width="240" height="36" fill="#f9f5d7" rx="18" stroke="#d5c4a1" stroke-width="1"/>
    <text x="380" y="93" text-anchor="middle" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Full scan fits schedule window?</text>

    <!-- Yes to Full replace -->
    <line x1="500" y1="88" x2="618" y2="88" stroke="#bdae93" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="550" y="82" text-anchor="middle" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">Yes</text>
    <rect x="620" y="72" width="120" height="32" fill="#689d6a" rx="4" opacity="0.25"/>
    <rect x="620" y="72" width="4" height="32" fill="#689d6a" rx="2"/>
    <text x="684" y="93" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">Full replace</text>

    <!-- No down -->
    <line x1="380" y1="106" x2="380" y2="156" stroke="#bdae93" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="392" y="136" fill="#cc241d" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">No</text>

    <!-- Node 2: Changes cluster in recent window? -->
    <rect x="240" y="158" width="280" height="36" fill="#f9f5d7" rx="18" stroke="#d5c4a1" stroke-width="1"/>
    <text x="380" y="181" text-anchor="middle" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Changes cluster in a recent window?</text>

    <!-- Yes to Scoped replace -->
    <line x1="520" y1="176" x2="618" y2="176" stroke="#bdae93" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="560" y="170" text-anchor="middle" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">Yes</text>
    <rect x="620" y="160" width="120" height="32" fill="#79740e" rx="4" opacity="0.25"/>
    <rect x="620" y="160" width="4" height="32" fill="#79740e" rx="2"/>
    <text x="684" y="181" text-anchor="middle" fill="#79740e" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">Scoped replace</text>

    <!-- No down -->
    <line x1="380" y1="194" x2="380" y2="244" stroke="#bdae93" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="392" y="224" fill="#cc241d" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">No</text>

    <!-- Node 3: Has reliable cursor? -->
    <rect x="260" y="246" width="240" height="36" fill="#f9f5d7" rx="18" stroke="#d5c4a1" stroke-width="1"/>
    <text x="380" y="269" text-anchor="middle" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Has reliable cursor?</text>

    <!-- No to Scoped + periodic full -->
    <line x1="260" y1="264" x2="142" y2="264" stroke="#bdae93" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="210" y="258" text-anchor="middle" fill="#cc241d" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">No</text>
    <rect x="16" y="248" width="124" height="44" fill="#d65d0e" rx="4" opacity="0.2"/>
    <rect x="16" y="248" width="4" height="44" fill="#d65d0e" rx="2"/>
    <text x="82" y="266" text-anchor="middle" fill="#af3a03" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">Scoped replace</text>
    <text x="82" y="280" text-anchor="middle" fill="#af3a03" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">+ periodic full</text>

    <!-- Yes down -->
    <line x1="380" y1="282" x2="380" y2="332" stroke="#bdae93" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="392" y="312" fill="#689d6a" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">Yes</text>

    <!-- Node 4: Destination profile? -->
    <rect x="260" y="334" width="240" height="36" fill="#f9f5d7" rx="18" stroke="#d5c4a1" stroke-width="1"/>
    <text x="380" y="357" text-anchor="middle" fill="#3c3836" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Destination profile?</text>

    <!-- High write to A+M -->
    <line x1="260" y1="352" x2="142" y2="352" stroke="#bdae93" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="200" y="343" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">writes &gt;&gt; reads</text>
    <rect x="16" y="336" width="124" height="44" fill="#d79921" rx="4" opacity="0.2"/>
    <rect x="16" y="336" width="4" height="44" fill="#d79921" rx="2"/>
    <text x="82" y="354" text-anchor="middle" fill="#b57614" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">Append +</text>
    <text x="82" y="368" text-anchor="middle" fill="#b57614" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">materialize</text>

    <!-- High read to Merge -->
    <line x1="500" y1="352" x2="618" y2="352" stroke="#bdae93" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="560" y="343" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="10">reads &gt;&gt; writes</text>
    <rect x="620" y="336" width="120" height="32" fill="#9d0006" rx="4" opacity="0.2"/>
    <rect x="620" y="336" width="4" height="32" fill="#cc241d" rx="2"/>
    <text x="684" y="357" text-anchor="middle" fill="#9d0006" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">Merge</text>

    <!-- Cost gradient legend -->
    <text x="316" y="418" text-anchor="end" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">Low complexity</text>
    <rect x="324" y="410" width="12" height="8" fill="#689d6a" opacity="0.5" rx="2"/>
    <rect x="338" y="410" width="12" height="8" fill="#79740e" opacity="0.5" rx="2"/>
    <rect x="352" y="410" width="12" height="8" fill="#d79921" opacity="0.5" rx="2"/>
    <rect x="366" y="410" width="12" height="8" fill="#d65d0e" opacity="0.5" rx="2"/>
    <rect x="380" y="410" width="12" height="8" fill="#9d0006" opacity="0.5" rx="2"/>
    <text x="400" y="418" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="9">High</text>
  </g>
</svg>
