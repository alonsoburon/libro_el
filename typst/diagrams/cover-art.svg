<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842">
  <rect width="595" height="842" fill="#ffffff"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="595" height="5" fill="#076678"/>

  <!-- DRAFT tag, top-right -->
  <rect x="447" y="34" width="110" height="26" rx="3" fill="none" stroke="#9d0006" stroke-width="1.5"/>
  <text x="502" y="52" text-anchor="middle" fill="#9d0006" font-family="'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="3">DRAFT</text>

  <!-- Faint diagonal DRAFT watermark -->
  <text x="297" y="470" text-anchor="middle" fill="#928374" opacity="0.06" font-family="'Courier New', monospace" font-size="150" font-weight="700" letter-spacing="8" transform="rotate(-28 297 470)">DRAFT</text>

  <!-- Title -->
  <text x="297" y="150" text-anchor="middle" fill="#282828" font-family="'Libertinus Serif', Georgia, serif" font-size="42" font-weight="700">Battle-Tested</text>
  <text x="297" y="202" text-anchor="middle" fill="#282828" font-family="'Libertinus Serif', Georgia, serif" font-size="42" font-weight="700">Data Pipelines</text>

  <line x1="160" y1="228" x2="435" y2="228" stroke="#d5c4a1" stroke-width="1"/>

  <text x="297" y="258" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="15">The step ELT forgot</text>
  <text x="297" y="282" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">Patterns for extraction, syntactic transformation, and loading</text>

  <!-- ===== Cover-art placeholder (wireframe box) ===== -->
  <rect x="120" y="330" width="355" height="300" rx="6" fill="#f9f5d7" fill-opacity="0.4" stroke="#bdae93" stroke-width="1.5" stroke-dasharray="8,6"/>
  <!-- Crossed guides -->
  <g stroke="#d5c4a1" stroke-width="1" stroke-dasharray="4,5" opacity="0.7">
    <line x1="120" y1="330" x2="475" y2="630"/>
    <line x1="475" y1="330" x2="120" y2="630"/>
  </g>
  <text x="297" y="475" text-anchor="middle" fill="#7c6f64" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">cover illustration</text>
  <text x="297" y="497" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-style="italic">to be designed</text>

  <!-- Author -->
  <text x="297" y="700" text-anchor="middle" fill="#504945" font-family="'Segoe UI', system-ui, sans-serif" font-size="16">Alonso Burón Ardiles</text>

  <!-- Editor note -->
  <line x1="180" y1="730" x2="415" y2="730" stroke="#d5c4a1" stroke-width="1"/>
  <text x="297" y="756" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Working draft for editorial review</text>
  <text x="297" y="774" text-anchor="middle" fill="#928374" font-family="'Segoe UI', system-ui, sans-serif" font-size="11">Final cover and diagrams pending design</text>

  <!-- Bottom accent line -->
  <rect x="0" y="837" width="595" height="5" fill="#076678"/>

  <!-- Corner / registration marks -->
  <g stroke="#d5c4a1" stroke-width="1">
    <line x1="20" y1="25" x2="20" y2="50"/><line x1="20" y1="25" x2="45" y2="25"/>
    <line x1="575" y1="25" x2="575" y2="50"/><line x1="575" y1="25" x2="550" y2="25"/>
    <line x1="20" y1="817" x2="20" y2="792"/><line x1="20" y1="817" x2="45" y2="817"/>
    <line x1="575" y1="817" x2="575" y2="792"/><line x1="575" y1="817" x2="550" y2="817"/>
  </g>
</svg>
